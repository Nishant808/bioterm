[project]
name = "bioterm"
version = "0.1.0"
description = "Open-source biotech/pharma catalyst-monitoring terminal (6-month swing horizon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "vaderSentiment>=3.3.2",
    "apscheduler>=3.10",
    "streamlit>=1.63",
    "plotly>=6.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "tenacity>=8.3",
    "watchdog>=6.0",
    "cryptography>=42",
    "anthropic>=1.8",
    "Authlib>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "ruff>=0.6"]
# read-only JSON API + always-on worker container (deploy/)
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
bioterm = "bioterm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioterm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["video", "data"]

[tool.ruff.lint]
# correctness only: syntax errors, undefined names, unused imports/variables,
# redefinitions - style stays a review matter
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]
