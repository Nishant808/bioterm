# BioTerm - always-on deployment on a small VPS.
#   cd deploy && docker compose up -d --build
#
# `worker`    runs the ingestion scheduler (news q15m, market q30m, pipeline daily)
# `pulse`     the always-on live layer: halts, new SEC filings, wires, big movers and
#             their alerts every 5 minutes in market hours (`bioterm worker`; a DB
#             lease keeps it from double-firing with the Actions pulse)
# `api`       the read-only JSON API on :8000 (set BIOTERM_API_TOKEN)
# `dashboard` serves the Streamlit UI on :8501
# All share the same SQLite file on the `bioterm-data` volume.
#
# To move to Postgres instead (recommended for cloud): add a `db:` service or use a
# managed Postgres, then set DATABASE_URL=postgresql+psycopg://... on both services.

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["bioterm", "scheduler"]
    environment:
      DATABASE_URL: sqlite:////data/bioterm.db
      BIOTERM_SEC_USER_AGENT: "BioTerm/0.1 (you@example.com)"
      TZ: UTC
    volumes:
      - bioterm-data:/data
    restart: unless-stopped

  pulse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["bioterm", "worker", "--interval", "300"]
    environment:
      DATABASE_URL: sqlite:////data/bioterm.db
      BIOTERM_SEC_USER_AGENT: "BioTerm/0.1 (you@example.com)"
      TZ: UTC
    volumes:
      - bioterm-data:/data
    depends_on:
      - worker
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["bioterm", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/bioterm.db
      BIOTERM_API_TOKEN: "change-me"
    volumes:
      - bioterm-data:/data
    depends_on:
      - worker
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: sqlite:////data/bioterm.db
    volumes:
      - bioterm-data:/data
    depends_on:
      - worker
    restart: unless-stopped

volumes:
  bioterm-data:
