# Full pipeline: universe + prices + technicals + EDGAR + fundamentals + clinical
# trials + FDA + insiders + news + catalysts + Focus Score. ~15-25 min.
#
# Secrets: DATABASE_URL, SEC_UA
#
# Cadence tuned for a PRIVATE repo (2000 Actions-min/month free tier):
#   once daily at 09:00 UTC  ·  ~30 runs/month · ~20 min · ~600 min/month
#   (prices/fundamentals/trials/filings don't move fast enough to need more)
# Combined with ingest-fast that's ~1650 min/month. On a public repo you can run
# this 3x/day ("0 6,13,21 * * *").

name: ingest-full

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: bioterm-ingest
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - name: Full refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIOTERM_SEC_USER_AGENT: ${{ secrets.SEC_UA }}
        run: uv run bioterm ingest --preset full
      - name: Summary
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run bioterm status || true
