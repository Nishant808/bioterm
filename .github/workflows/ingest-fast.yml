# Fast pass: sector news + per-ticker Google News + sentiment + catalysts + Focus
# Score + alert check. ~4-8 min. Keeps "Stocks in Focus" and the news feed current.
#
# Secrets: DATABASE_URL, SEC_UA  (+ optional TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
#
# Cadence tuned for a PRIVATE repo (2000 Actions-min/month free tier):
#   every 2h from 11:00-23:00 UTC (≈ 7am-7pm ET, when biotech news breaks)
#   ≈ 7 runs/day · ~5 min each · ~1050 min/month
# On a public repo you can widen this to "*/30 * * * *" (unlimited minutes).

name: ingest-fast

on:
  schedule:
    - cron: "0 11-23/2 * * *"
  workflow_dispatch: {}

concurrency:
  group: bioterm-ingest
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - name: Fast refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIOTERM_SEC_USER_AGENT: ${{ secrets.SEC_UA }}
        run: |
          uv run bioterm init-db
          uv run bioterm ingest --preset fast
      - name: Alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run bioterm alerts
