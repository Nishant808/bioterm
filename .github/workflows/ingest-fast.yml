# Fast pass: sector + wire news, per-ticker Google News, sentiment, AI headline
# events, catalysts, molecule links, Focus Score, BUY/SELL signals, alert check.
# ~4-8 min. Keeps "Stocks in Focus", the signal board and the news feed current
# between the open and close runs (ingest-full.yml); the hourly pulse
# (pulse.yml) covers halts, filings and wires in between.
#
# Secrets: DATABASE_URL, SEC_UA  (+ optional TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
#
# Cadence for a PRIVATE repo (2000 Actions-min/month free tier):
#   16:00 · 18:30 · 23:00 UTC (≈ midday, afternoon, evening New York)
#   3 runs/day · ~5 min each · ~450 min/month
# On a public repo you can widen this to "*/30 * * * *" (unlimited minutes).

name: ingest-fast

on:
  schedule:
    - cron: "0 16,23 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: bioterm-ingest
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --no-dev
      - name: Fast refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIOTERM_SEC_USER_AGENT: ${{ secrets.SEC_UA }}
        run: |
          uv run bioterm init-db
          uv run bioterm ingest --preset fast
      - name: Alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIOTERM_SEC_USER_AGENT: ${{ secrets.SEC_UA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run bioterm alerts
