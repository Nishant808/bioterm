# Fast pass: sector news + per-ticker Google News + sentiment + catalysts + Focus
# Score. ~4-8 min. This is what keeps "Stocks in Focus" and the news feed current
# between the 3x/day full runs.
#
# Same two secrets as ingest-full.yml (DATABASE_URL, SEC_UA).

name: ingest-fast

on:
  schedule:
    - cron: "*/30 * * * *"         # every 30 min (GitHub may batch/delay under load)
  workflow_dispatch: {}

concurrency:
  group: bioterm-ingest
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e .
      - name: Fast refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIOTERM_SEC_USER_AGENT: ${{ secrets.SEC_UA }}
        run: |
          bioterm init-db
          bioterm ingest --preset fast
