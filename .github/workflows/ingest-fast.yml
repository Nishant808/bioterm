# Fast pass: sector + wire news, per-ticker Google News, sentiment, AI headline
# events, catalysts, molecule links, Focus Score, BUY/SELL signals, alert check.
# ~4-8 min. Keeps "Stocks in Focus", the signal board and the news feed current
# between the open and close runs (ingest-full.yml); the hourly pulse
# (pulse.yml) covers halts, filings and wires in between.
#
# Secrets: DATABASE_URL, SEC_UA  (+ optional TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
#
# Cadence for a PRIVATE repo (2000 Actions-min/month free tier):
#   weekdays 16:00 · 18:30 · 23:00 UTC (≈ midday, afternoon, evening New York),
#   weekends once at 23:00 UTC - ~74 runs · ~6 min ≈ 450 min/month
# Whole budget: ingest-full ~880 + this ~450 + pulse ~300 + backup ~16 ≈ 1,650.
# On a public repo you can widen this to "*/30 * * * *" (unlimited minutes).

name: ingest-fast

on:
  schedule:
    - cron: "0 16,23 * * 1-5"
    - cron: "30 18 * * 1-5"
    - cron: "0 23 * * 0,6"
  workflow_dispatch: {}

concurrency:
  group: bioterm-ingest
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # only needed if the vault key was set explicitly (see src/bioterm/vault.py)
      BIOTERM_SECRET_KEY: ${{ secrets.BIOTERM_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --no-dev
      - name: Fast refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIOTERM_SEC_USER_AGENT: ${{ secrets.SEC_UA }}
        run: |
          uv run bioterm init-db
          uv run bioterm ingest --preset fast
      - name: Alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIOTERM_SEC_USER_AGENT: ${{ secrets.SEC_UA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run bioterm alerts
