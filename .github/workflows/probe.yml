# Live-source smoke test on a throwaway Postgres 16 (a service container - the
# production DATABASE_URL is never used): runs every ingest + process job against
# the real endpoints over a small slice of the universe, prints a data-quality
# report, then renders every dashboard page against the result. Postgres, not
# SQLite, because it's what Neon runs: it enforces VARCHAR lengths, types and
# NULL ordering that SQLite lets slide. Use it after changing an ingest module -
# sources change formats without notice.
#
# Secrets: SEC_UA (EDGAR requires a contact User-Agent). ~8-12 min.

name: probe

on:
  workflow_dispatch: {}
  push:
    branches: [main-vcyb9o]
    paths:
      - "src/bioterm/**"
      - "config/**"
      - "dashboard/**"
      - ".github/workflows/probe.yml"

concurrency:
  group: bioterm-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: bioterm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BIOTERM_SEC_USER_AGENT: ${{ secrets.SEC_UA }}
      DATABASE_URL: postgresql+psycopg://postgres:probe@localhost:5432/bioterm
      BIOTERM_INAPP_WORKER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - name: NLP extra (FinBERT)
        continue-on-error: true
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install "transformers>=4.44"
      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - name: Universe + market
        run: |
          uv run bioterm init-db
          uv run bioterm universe
          uv run bioterm ingest --limit 70 --only prices,technicals
      - name: Filings, fundamentals, trials
        run: uv run bioterm ingest --limit 30 --only edgar,fundamentals,clinical,fda
      - name: Alt data
        run: uv run bioterm ingest --limit 70 --only shortvol,institutions,molecules,options
      - name: News + NLP
        run: uv run bioterm ingest --limit 25 --only news,sentiment,finbert
      - name: Real-time (halts, live filings, wires, PDUFA/AdCom, pulse)
        run: |
          uv run bioterm ingest --only halts,filingslive,pdufa
          uv run bioterm pulse --no-deliver
      - name: Derived
        run: uv run bioterm ingest --only catalysts,mollinks,score,signals,backtest,insiders
      - name: Research (outcomes, landscape, 13F data sets, drugs, gov, ETF flows)
        run: uv run bioterm ingest --only outcomes,landscape,whole13f,drugs,gov,etf
      - name: Platform (SIC universe, extended tier, snapshots, retention, DQ, backup, API)
        run: |
          uv pip install "fastapi>=0.115" "httpx>=0.27"
          uv run bioterm ingest --only sicuniverse
          uv run python - <<'EOF'
          from bioterm import pipeline
          print(pipeline.refresh_extended(per_run=8))
          print(pipeline.housekeeping())
          EOF
          uv run bioterm retention --dry-run
          uv run bioterm backup --out /tmp/probe-backup.zip
          uv run python - <<'EOF'
          import os
          from fastapi.testclient import TestClient
          from bioterm.api import create_app
          os.environ["BIOTERM_API_TOKEN"] = "probe"
          c = TestClient(create_app())
          h = {"Authorization": "Bearer probe"}
          for path in ["/health", "/universe?tier=all", "/scores", "/signals", "/catalysts",
                       "/stock/VRTX", "/screen?preset=Dilution%20risk", "/alerts", "/dq"]:
              r = c.get(path, headers=h)
              body = r.json()
              print(path, r.status_code, len(body) if isinstance(body, list) else list(body)[:6])
              assert r.status_code in (200, 404), (path, r.status_code, r.text[:300])
          EOF
      - name: Report
        if: always()
        run: |
          uv run python - <<'EOF'
          import json
          import pandas as pd
          from bioterm.db import read_sql
          pd.set_option("display.width", 220); pd.set_option("display.max_columns", 30)
          pd.set_option("display.max_colwidth", 70)
          def q(title, sql):
              print(f"\n===== {title}")
              try:
                  df = read_sql(sql)
                  print(df.to_string(index=False) if not df.empty else "(empty)")
              except Exception as e:
                  print("ERR", e)
          for t in ["securities", "prices", "fundamentals", "filings", "clinical_trials", "news", "news_nlp",
                    "catalysts", "insider_txns", "inst_filers", "inst_holdings", "cusip_map",
                    "short_volume", "options_snapshots", "molecules", "molecule_trials",
                    "molecule_links", "molecule_status", "signals", "signal_scores", "backtests"]:
              q(t, f"SELECT COUNT(*) AS n FROM {t}")
          q("job errors", "SELECT job, status, rows, substr(detail, 1, 600) AS detail FROM ingest_runs ORDER BY id")
          q("13F filers", "SELECT cik, name, last_period, last_filed FROM inst_filers")
          q("13F by fund/period", "SELECT cik, period, COUNT(*) AS n, SUM(value)/1e6 AS value_m, COUNT(ticker) AS mapped FROM inst_holdings GROUP BY cik, period ORDER BY cik, period")
          q("cusip map methods", "SELECT method, COUNT(*) AS n FROM cusip_map GROUP BY method")
          q("unmapped top issuers", "SELECT issuer, cusip, SUM(value)/1e6 AS value_m FROM inst_holdings WHERE ticker IS NULL GROUP BY issuer, cusip ORDER BY value_m DESC LIMIT 15")
          q("distinct 13F cusips", "SELECT COUNT(DISTINCT cusip) AS n FROM inst_holdings")
          q("molecule aliases", "SELECT molecule_id, discovered_aliases FROM molecule_status")
          q("trial sponsors", "SELECT molecule_id, nct_id, phase, sponsor_class, substr(sponsor, 1, 40) AS sponsor FROM molecule_trials ORDER BY molecule_id LIMIT 30")
          q("short volume latest", "SELECT * FROM short_volume ORDER BY date DESC, short_volume DESC LIMIT 8")
          q("short volume dates", "SELECT date, COUNT(*) AS n FROM short_volume GROUP BY date ORDER BY date DESC LIMIT 5")
          q("options", "SELECT ticker, expiry, days_to_expiry, atm_iv, implied_move, pc_volume_ratio, pc_oi_ratio, vol_oi_ratio FROM options_snapshots LIMIT 15")
          q("molecules", "SELECT id, ticker, name, aliases, nct_ids FROM molecules LIMIT 20")
          q("molecule status", "SELECT * FROM molecule_status LIMIT 20")
          q("molecule trials", "SELECT molecule_id, nct_id, phase, status, primary_completion_date, source FROM molecule_trials LIMIT 25")
          q("molecule links", "SELECT molecule_id, kind, COUNT(*) AS n FROM molecule_links GROUP BY molecule_id, kind LIMIT 30")
          q("finbert sample", "SELECT n.title, x.vader, x.finbert, x.label, x.confidence FROM news_nlp x JOIN news n ON n.id = x.id LIMIT 15")
          q("signal labels", "SELECT label, COUNT(*) AS n FROM signal_scores GROUP BY label")
          q("signal codes", "SELECT code, side, COUNT(*) AS n, AVG(strength) AS s FROM signals GROUP BY code, side ORDER BY n DESC")
          q("top calls", "SELECT ticker, label, net, bull, bear, n_buy, n_sell, regime FROM signal_scores ORDER BY net DESC LIMIT 10")
          q("bottom calls", "SELECT ticker, label, net, bull, bear, n_buy, n_sell FROM signal_scores ORDER BY net ASC LIMIT 10")
          q("molecule catalysts", "SELECT ticker, type, date, title FROM catalysts WHERE source = 'molecule-tracking' LIMIT 10")
          q("halts", "SELECT symbol, ticker, reason, halt_at, resumption_trade_time FROM halts ORDER BY halt_at DESC LIMIT 12")
          q("halt count", "SELECT COUNT(*) AS n, COUNT(ticker) AS universe FROM halts")
          q("live filings", "SELECT ticker, form, items, filed_date, url FROM filings WHERE source = 'live' ORDER BY fetched_at DESC LIMIT 15")
          q("news by source (wires)", "SELECT source, COUNT(*) AS n FROM news GROUP BY source ORDER BY n DESC")
          q("pdufa/adcom extracted", "SELECT id, kind, ticker, pdufa_date, adcom_date, drug, confidence, substr(summary, 1, 90) AS summary FROM news_llm ORDER BY scored_at DESC LIMIT 20")
          q("regulatory catalysts", "SELECT ticker, type, date, source, substr(title, 1, 80) AS title FROM catalysts WHERE type IN ('pdufa','adcom') ORDER BY date LIMIT 20")
          q("app meta (pulse)", "SELECT key, substr(value, 1, 400) AS value FROM app_meta WHERE key IN ('worker_state','movers_live')")
          q("trial changes", "SELECT kind, COUNT(*) AS n FROM trial_changes GROUP BY kind")
          q("catalyst events", "SELECT kind, direction, source, COUNT(*) AS n, AVG(ret_1d) AS avg_reaction FROM catalyst_events GROUP BY kind, direction, source")
          q("outcome base rates", "SELECT substr(results, 1, 1500) AS r FROM backtests WHERE kind = 'outcomes'")
          q("landscape", "SELECT condition, COUNT(*) AS n, COUNT(sponsor_ticker) AS universe FROM landscape_trials GROUP BY condition ORDER BY n DESC LIMIT 15")
          q("whole-market 13F", "SELECT ticker, period, holders, holders_prev, new_holders, exited_holders, value/1e6 AS value_m FROM inst_ownership ORDER BY value DESC LIMIT 15")
          q("LOE calendar", "SELECT ticker, trade_name, appl_no, approval_date, patent_expiry, exclusivity_expiry, loe_date FROM loe_calendar ORDER BY loe_date LIMIT 20")
          q("FAERS", "SELECT brand, ticker, quarter, reports FROM faers_counts ORDER BY brand, quarter DESC LIMIT 20")
          q("gov awards", "SELECT ticker, agency, sub_agency, amount, start_date, award_type FROM gov_awards ORDER BY amount DESC LIMIT 15")
          q("ETF flows", "SELECT etf, date, nav, shares_out, aum/1e6 AS aum_m, flow_est/1e6 AS flow_m FROM etf_flows ORDER BY date DESC LIMIT 10")
          q("fundamentals overhang", "SELECT ticker, shares_out, xbrl_shares_out, warrants_out, options_out, total_debt FROM fundamentals WHERE warrants_out IS NOT NULL OR total_debt IS NOT NULL LIMIT 15")
          q("tiers", "SELECT COALESCE(tier, 'core') AS tier, sic, COUNT(*) AS n FROM securities GROUP BY COALESCE(tier, 'core'), sic ORDER BY n DESC")
          q("extended sample", "SELECT ticker, name, exchange, cik, sic FROM securities WHERE tier = 'extended' ORDER BY ticker LIMIT 25")
          q("extended prices", "SELECT COUNT(DISTINCT p.ticker) AS names, COUNT(*) AS rows FROM prices p JOIN securities s ON s.ticker = p.ticker WHERE s.tier = 'extended'")
          q("snapshots", "SELECT 'fundamental' AS kind, COUNT(*) AS n FROM fundamental_snapshots UNION ALL SELECT 'catalyst', COUNT(*) FROM catalyst_snapshots UNION ALL SELECT 'universe', COUNT(*) FROM universe_snapshots")
          q("dq checks", 'SELECT "check", status, count, substr(detail, 1, 160) AS detail FROM dq_checks ORDER BY status, "check"')
          try:
              from bioterm.process import backtest as bt
              from bioterm.process import smart_money as sm
              fac = bt.latest("factor") or {}
              print("\n===== factor study"); print(json.dumps({k: {kk: vv for kk, vv in v.items() if not isinstance(vv, list)} for k, v in (fac.get("factors") or {}).items()}, indent=1, default=str)[:3000])
              ev = bt.latest("events") or {}
              print("\n===== event study", ev.get("n_events")); print(json.dumps(ev.get("by_code"), indent=1, default=str)[:4000])
              ch = sm.fund_changes(sm.load_holdings())
              print("\n===== smart money"); print(sm.ticker_summary(ch).head(20).to_string(index=False))
          except Exception as e:
              print("ERR", e)
          EOF
      - name: Dashboard live prices (Yahoo)
        if: always()
        run: |
          uv run python - <<'EOF'
          import sys
          sys.path.insert(0, "dashboard")
          import _live as live
          q = live.quotes(["VRTX", "MRNA", "XBI", "NOPE_TICKER"])
          print({k: (round(v["price"], 2), v["source"]) for k, v in q.items()})
          d, src = live.history("VRTX", "2y")
          i, isrc = live.history("VRTX", "5d", "15m")
          c, csrc = live.closes(["VRTX", "MRNA"], "2026-01-02")
          print("daily", len(d), src, "intraday", len(i), isrc, "closes", len(c), csrc)
          print(live.indicators(d).iloc[-1][["close", "sma50", "rsi14", "ret_1m"]].to_dict())
          ok = {"VRTX", "MRNA", "XBI"} <= {k for k, v in q.items() if v["source"] == "live"}
          ok = ok and src == "live" and len(d) > 400 and isrc == "live" and len(i) > 20
          from bioterm import quotes
          nq = quotes._nasdaq("VRTX")
          print("nasdaq failover:", nq)
          ok = ok and nq is not None and nq["price"] > 0
          sys.exit(0 if ok else 1)
          EOF
      - name: Dashboard pages on this database
        if: always()
        run: |
          uv run python - <<'EOF'
          import sys
          from streamlit.testing.v1 import AppTest
          pages = ["overview", "signals", "focus", "stock", "smart_money", "molecules",
                   "backtest", "catalysts", "news", "watchlist", "compare", "alerts",
                   "portfolio", "market", "copilot", "settings", "health", "screener", "workspace"]
          bad = 0
          for page in pages:
              at = AppTest.from_file("dashboard/Home.py", default_timeout=120)
              at.run()
              if page != "overview":
                  at.switch_page(f"app_pages/{page}.py")
                  at.run()
              errs = [e.value for e in at.exception]
              bad += bool(errs)
              print(f"{page:12s} {'FAIL ' + str(errs)[:600] if errs else 'ok'}")
          sys.exit(1 if bad else 0)
          EOF
      - name: Summary (tail of the log)
        if: always()
        run: |
          uv run python - <<'EOF'
          from bioterm.db import read_sql
          for t in ["halts", "filings", "news", "news_llm", "catalysts", "trial_changes",
                    "catalyst_events", "landscape_trials", "inst_ownership", "loe_calendar",
                    "faers_counts", "gov_awards", "etf_flows", "signal_scores",
                    "fundamental_snapshots", "catalyst_snapshots", "universe_snapshots",
                    "dq_checks"]:
              try:
                  print(f"{t:18s}", int(read_sql(f"SELECT COUNT(*) AS n FROM {t}").iloc[0]["n"]))
              except Exception as e:
                  print(t, "ERR", e)
          print(read_sql("SELECT job, status, rows, substr(detail, 1, 300) AS detail FROM ingest_runs ORDER BY id").to_string(index=False))
          EOF
