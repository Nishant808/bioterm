# BioTerm configuration. Everything here is hot-reloaded on each pipeline run.

horizon_months: 6            # swing-trade horizon the whole system is tuned around
price_history_period: "5y"   # yfinance period for a first (backfill) pull; later runs
                             # fetch only the last month for tickers already stored
benchmarks: ["XBI", "IBB", "SPY"]   # priced + charted for regime/relative strength, never ranked

universe:
  use_xbi: true              # SPDR S&P Biotech ETF holdings (equal-weight, small/mid biotech)
  use_ibb: false             # iShares Biotechnology ETF - iShares blocks non-browser downloads;
                             # large-cap biotech it holds is covered by universe_seed.yml anyway
  use_seed: true             # bundled large-cap pharma list (config/universe_seed.yml)
  include_watchlist: true    # always include everything in config/watchlist.yml
  refresh_days: 7            # rebuild the universe at most this often

ingest:
  clinical_max_sponsors_per_run: 400   # ClinicalTrials.gov calls per clinical run
  news_google_per_ticker: true          # add a Google News RSS query per ticker
  news_lookback_days: 45                # drop news older than this on ingest
  edgar_forms: ["8-K", "424B5", "S-1", "S-3"]   # filings that matter for catalysts/dilution
  edgar_risk_forms: ["10-K", "10-Q"]            # checked for going-concern language
  risk_flag_max_fetches: 20                     # filing bodies downloaded per EDGAR run

sentiment:
  # High-signal biotech event tags -> weight used by the news-flow sub-score.
  # Each phrase below is matched with common verb-tense / plural variants
  # automatically (process/sentiment.py:_compile_phrase) - you don't need a
  # separate entry for "meet"/"meets"/"met"/"meeting" or "endpoint"/"endpoints".
  positive_events:
    topline: 1.0
    "meets primary endpoint": 1.0
    "hits primary endpoint": 1.0
    "statistically significant": 0.8
    approval: 1.0
    approved: 1.0
    "regulatory approval": 1.0
    "fda clearance": 0.9
    "breakthrough therapy": 0.9
    "fast track": 0.6
    "orphan drug": 0.5
    "priority review": 0.8
    "accelerated approval": 0.9
    "wins approval": 1.0
    "grants approval": 1.0
    partnership: 0.6
    collaboration: 0.5
    licensing: 0.5
    acquisition: 0.8
    "positive data": 0.9
    "positive results": 0.9
    "positive topline": 1.0
    "durable response": 0.7
    "objective response rate": 0.6
  negative_events:
    "clinical hold": -1.0
    "complete response letter": -1.0
    crl: -1.0
    "failed to meet": -1.0
    "did not meet": -1.0
    "fails to meet": -1.0
    "missed primary endpoint": -1.0
    discontinued: -0.9
    "trial halted": -0.9
    "safety concern": -0.7
    "safety signal": -0.7
    "adverse event": -0.5
    "black box warning": -0.8
    "going concern": -0.8
    "offering of": -0.4
    "priced offering": -0.5
    dilution: -0.4
    layoffs: -0.5
    restructuring: -0.4
    "trial failure": -0.9
    "study failure": -0.9
    futility: -0.8
    "voted against approval": -0.9
    "fda rejects": -1.0
    "rejected by fda": -1.0
    "regulatory delay": -0.5

score:
  weights:
    momentum: 0.30
    catalyst: 0.40      # the pipeline is the point - weight it highest
    newsflow: 0.30
    risk: 0.25          # subtracted
  catalyst_top_k: 6      # only the strongest N catalysts count (keeps mega-caps from dominating)
  catalyst_type_weights:
    phase3_readout: 1.0
    fda_action: 0.95
    phase2_readout: 0.6
    pdufa: 1.0
    adcom: 0.9
    earnings: 0.25
    phase1_readout: 0.3
    trial_completion: 0.5
  risk:
    runway_quarters_floor: 4.0   # below this, cash-runway risk ramps toward 1.0
    going_concern_weight: 0.35   # added to risk when the latest 10-K/10-Q flags going-concern doubt
  conviction_map:                # watchlist conviction (1-5) -> score multiplier
    1: 0.6
    2: 0.8
    3: 1.0
    4: 1.2
    5: 1.4
  default_conviction_mult: 1.0   # names not on the watchlist

# ------------------------------------------------------------------ alternative data
alt_data:
  short_volume_days: 30          # FINRA Reg SHO daily files to backfill on first run
  short_volume_keep_days: 180
  options_max_tickers: 90        # yfinance option chains per full run (watchlist + focus + catalysts)
  options_time_budget_s: 300
  institutions_time_budget_s: 240
  openfigi_max_lookups: 300      # CUSIPs resolved via OpenFIGI per run when names don't match
                                 # (10 per request, ~25 requests/min without a key; largest first)
  molecules_time_budget_s: 180

nlp:
  model: "ProsusAI/finbert"      # HF model id; only used when transformers + torch are installed
  batch_size: 32
  max_per_run: 6000

# ------------------------------------------------------------------ signal engine
# Every detector is a small rule over open data. Strengths are 0-1 before the
# regime / conviction / empirical-edge adjustments; the composite is
#   bull = 1 - prod(1 - s_buy)   bear = 1 - prod(1 - s_sell)   net = bull - bear
signals:
  labels:            # thresholds on net (-1..1)
    strong_buy: 0.55
    buy: 0.25
    sell: -0.25
    strong_sell: -0.55
  strong_min_families: 2   # STRONG labels need evidence from >= this many families
                           # (technical, event, capital, people, news, flow)
  keep_days: 400     # signal history retained for the live track record
  regime_benchmark: XBI
  regime_mult:       # buy / sell strength multipliers by biotech-tape regime
    risk_on:  {buy: 1.10, sell: 0.90}
    neutral:  {buy: 1.00, sell: 1.00}
    risk_off: {buy: 0.80, sell: 1.15}
  conviction_weight: 0.5     # how much watchlist conviction scales buy strength
  calibrate: true            # scale detectors by their measured edge in the latest event study
  calibration_floor_buy: 0.5    # a buy detector that tests negative can be cut this far
  calibration_floor_sell: 0.75  # sell detectors: the backtest's survivorship bias penalises them
  detectors:
    breakout_52w:           {strength: 0.55, min_vol_z: 1.0}
    golden_cross:           {strength: 0.45}
    death_cross:            {strength: 0.45}
    reclaim_sma200:         {strength: 0.35, min_vol_z: 0.5}
    breakdown_sma200:       {strength: 0.40, min_vol_z: 0.5}
    rsi_oversold_reversal:  {strength: 0.30}
    overbought_exhaustion:  {strength: 0.40, rsi: 80, min_ret_21: 0.35}
    accumulation:           {strength: 0.35, cmf: 0.20}
    distribution:           {strength: 0.35, cmf: -0.20}
    volume_surge_up:        {strength: 0.40, min_vol_z: 2.5, min_ret: 0.05}
    volume_surge_down:      {strength: 0.45, min_vol_z: 2.5, min_ret: -0.05}
    crash_day:              {strength: 0.55, max_ret: -0.20}
    relative_strength_leader: {strength: 0.40, min_rs: 90}
    relative_strength_laggard: {strength: 0.30, max_rs: 10}
    pre_catalyst_setup:     {strength: 0.60, min_days: 10, max_days: 120, max_ret_21: 0.30, max_rsi: 72}
    sell_the_news_risk:     {strength: 0.45, max_days: 14, min_ret_63: 0.40}
    catalyst_vacuum:        {strength: 0.15}
    insider_cluster_buy:    {strength: 0.55, min_buyers: 2, min_value: 250000}
    insider_heavy_selling:  {strength: 0.30, min_sellers: 3, min_value: 2000000}
    dilution_filing:        {strength: 0.50, days: 30}
    runway_crunch:          {strength: 0.40, max_quarters: 3.0}
    going_concern:          {strength: 0.60}
    positive_event:         {strength: 0.50, min_event: 0.9, days: 3}
    negative_event:         {strength: 0.60, max_event: -0.8, days: 5}
    regulatory_designation: {strength: 0.40, days: 14}
    sentiment_inflection:   {strength: 0.30, min_delta: 0.30, min_headlines: 3}
    specialist_accumulation: {strength: 0.50, min_funds: 2}
    specialist_exit:        {strength: 0.45, min_funds: 2}
    unusual_call_activity:  {strength: 0.35, min_vol_oi: 1.5, max_pc: 0.5}
    unusual_put_activity:   {strength: 0.35, min_vol_oi: 1.5, min_pc: 2.0}
    short_squeeze_setup:    {strength: 0.35, min_short_float: 0.20}
    short_pressure_rising:  {strength: 0.30, min_ratio: 0.55, min_delta: 0.08}
    pipeline_advance:       {strength: 0.30, days: 120}

backtest:
  rebalance_every: 5          # trading days between point-in-time snapshots
  horizons: [21, 63, 126]     # forward windows in trading days (1 / 3 / 6 months)
  warmup: 210                 # history needed before the first snapshot
  quantiles: 5

dashboard:
  focus_table_rows: 40
  news_firehose_rows: 200
  autorefresh_seconds: 300
