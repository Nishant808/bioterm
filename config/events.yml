# Industry calendar: medical meetings where data moves stocks, and EMA CHMP
# meetings (EU approval opinions come out on the Friday of each meeting week).
# Every date below was checked against the organiser's own site on 2026-09-25
# (EMA's published CHMP schedules for 2026 and 2027-2028). Add rows freely -
# the Catalysts page shows everything in the next 12 months.
#
# area: the disease areas whose companies typically present (config/pos_priors.yml
#       names) - used to point at universe names with programmes in that area.

